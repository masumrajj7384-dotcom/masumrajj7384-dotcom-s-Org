      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(30)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(45)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(60)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(75)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(90)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(105)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(120)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(135)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(150)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(165)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(180)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(195)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(210)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(225)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(240)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(255)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(270)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(285)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(300)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(315)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(330)"/>
      <polygon points="0,-90 3,-15 -3,-15" transform="rotate(345)"/>
    </g>
  </g>
</svg>
